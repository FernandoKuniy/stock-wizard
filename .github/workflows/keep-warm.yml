name: Keep warm

# The free Render web instance spins down after ~15 minutes idle, and the Supabase free project
# pauses after 7 days with no database activity. Pinging the readiness check (which runs a
# SELECT 1) on a schedule holds both awake, so a recruiter who clicks the link never lands on a
# cold start or a paused project.
#
# Set the repo variable API_HEALTH_URL (Settings -> Secrets and variables -> Actions -> Variables)
# to the deployed readiness URL, e.g. https://stock-wizard-api.onrender.com/health/ready. Until
# it's set, the job no-ops. Two GitHub caveats worth knowing: scheduled runs only fire on the
# default branch, and GitHub disables the schedule after 60 days with no repo activity.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the readiness check
        run: |
          url="${{ vars.API_HEALTH_URL }}"
          if [ -z "$url" ]; then
            echo "API_HEALTH_URL is not set yet; nothing to ping. Set it after deploying."
            exit 0
          fi
          # A warm instance answers in under a second, but a cold one has to boot first and
          # takes well over 30s. That's the exact case this job exists to fix, so the timeout
          # has to outlast a cold start or the first ping after any gap fails on its own.
          curl -fsS --max-time 120 --retry 2 --retry-all-errors --retry-delay 15 "$url" && echo " -- ok"
